[package]
name = "plasma-sip"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "plasma_sip"
path = "src/lib.rs"

[[bin]]
name = "plasma-sip"
path = "src/main.rs"

[dependencies]
sip-domain = { workspace = true }
sip-protocol = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
